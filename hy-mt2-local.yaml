# Hy-MT2-1.8B 本地翻译配置
# 摘要用 Gemini（推理能力强），翻译用本地 Hy-MT2（翻译专用，免费）
# 使用方式: subtitle-llm translate --config hy-mt2-local.yaml --input xxx.srt --target-language Chinese
#
# 前置条件:
#   1. 启动本地服务: ./start-hy-mt2.sh
#   2. export GEMINI_API_KEY="..."
#   3. export HYMT2_API_KEY="local-no-key-needed"

summary_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  top_p: 0.85
  top_k: 12
  retry_delay_seconds: 40

translation_model:
  provider: "custom"
  api_key_env: "HYMT2_API_KEY"
  endpoint: "http://127.0.0.1:8123/v1"
  model: "/Users/xiaguangwei/.cache/hy-mt2/Hy-MT2-1.8B-Q6_K.gguf"
  temperature: 0.3
  top_p: 0.8
  max_tokens: 4096
  rate_limit: 30
  max_retries: 3
  retry_delay_seconds: 10
