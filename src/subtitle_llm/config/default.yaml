config_version: "2"
default_output_format: "source-first"

pipeline:
  chunk_size: 34
  context_window_size: 4
  threads: 5
  ignore_subtitle_length: 4
  max_chars: 132
  max_duration: 10.0
  review_mode: "auto"
  context_review: false
  fallback_on_chunk_error: "source"

summary_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  max_tokens: 8192
  temperature: 0.5
  top_p: 0.85
  top_k: 12
  max_retries: 6
  retry_delay_seconds: 40

translation_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  max_tokens: 8192
  temperature: 0.8
  top_p: 0.85
  top_k: 12
  rate_limit: 15
  max_retries: 6
  retry_delay_seconds: 40

asr:
  model: "Qwen/Qwen3-ASR-1.7B"
  forced_aligner: "Qwen/Qwen3-ForcedAligner-0.6B"
  max_audio_length: 300
  device: "cpu"
