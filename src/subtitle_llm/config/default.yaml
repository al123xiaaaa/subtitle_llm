summary_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  top_p: 0.85
  top_k: 12
  retry_delay_seconds: 40

translation_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  temperature: 0.8
  top_p: 0.85
  top_k: 12
  rate_limit: 15
  retry_delay_seconds: 40

pipeline:
  normalize_subtitles: "auto"
  normalize_max_cue_chars: 84
  normalize_max_line_chars: 42
  normalize_max_duration: 7.0
  normalize_min_duration: 0.8
  semantic_translation: "auto"
  semantic_output_granularity: "cue"
  semantic_max_cues_per_unit: 6
  refine_translation: false

# FunASR Python SDK 配置（见 docs/adr/0003-asr-backend-migrate-to-funasr-sdk.md）。
# 通过 funasr.AutoModel 组合 paraformer-zh（识别）+ fsmn-vad（分段）+
# ct-punc（标点恢复）+ cam++（说话人分离，触发 sentence_info 输出）。
# 首次运行自动下载模型（约 1GB）。安装：pip install funasr（含 PyTorch）。
# 实测中文识别精度：paraformer-zh 明显优于 SenseVoiceSmall（多语言小模型），
# 且输出为连续中文文本（SenseVoice 词级 token 重组后字间带空格）。CPU 可跑。
asr:
  model_name: "paraformer-zh"
  punc_model: "ct-punc"
  spk_model: "cam++"
  max_single_segment_time: 8000
  device: "cpu"
  hub: "ms"
  trust_remote_code: false
