summary_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  top_p: 0.85
  top_k: 12
  retry_delay_seconds: 40

translation_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  temperature: 0.8
  top_p: 0.85
  top_k: 12
  rate_limit: 15
  retry_delay_seconds: 40

pipeline:
  normalize_subtitles: "auto"
  normalize_max_cue_chars: 84
  normalize_max_line_chars: 42
  normalize_max_duration: 7.0
  normalize_min_duration: 0.8
  semantic_translation: "auto"
  semantic_output_granularity: "cue"
  semantic_max_cues_per_unit: 6
  refine_translation: false

# FunASR Python SDK 配置（见 docs/adr/0003-asr-backend-migrate-to-funasr-sdk.md）。
# 默认 fun-asr-nano profile（中/英/日多语大模型，首次运行下载约 3GB）；
# 可选 profile 用 --asr-model 指定：paraformer-zh（中文轻量快速）/ qwen3-asr（多语高精度）。
asr:
  model_name: "FunAudioLLM/Fun-ASR-Nano-2512"
  max_single_segment_time: 30000
  device: "cpu"
  hub: "hf"
  trust_remote_code: true
