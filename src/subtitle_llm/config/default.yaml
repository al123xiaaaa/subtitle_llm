summary_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  top_p: 0.85
  top_k: 12
  retry_delay_seconds: 40

translation_model:
  provider: "gemini"
  api_key_env: "GEMINI_API_KEY"
  model: "gemini-3.1-flash-lite-preview"
  temperature: 0.8
  top_p: 0.85
  top_k: 12
  rate_limit: 15
  retry_delay_seconds: 40

pipeline:
  normalize_subtitles: "auto"
  normalize_max_cue_chars: 84
  normalize_max_line_chars: 42
  normalize_max_duration: 7.0
  normalize_min_duration: 0.8
  semantic_translation: "auto"
  semantic_output_granularity: "cue"
  semantic_max_cues_per_unit: 6
  refine_translation: false

# FunASR Python SDK 配置（见 docs/adr/0003-asr-backend-migrate-to-funasr-sdk.md）。
# 通过 funasr.AutoModel 组合 SenseVoice + fsmn-vad + ct-punc + cam++，
# 一次调用产出带时间戳、带标点、语言受约束的识别片段。
# 首次运行自动下载模型（约 1GB）。安装：pip install funasr（含 PyTorch）。
# CPU 可跑（SenseVoice 17 倍实时），无需 GPU。
asr:
  model_name: "FunAudioLLM/SenseVoiceSmall"
  punc_model: "ct-punc"
  spk_model: "cam++"
  max_single_segment_time: 8000
  device: "cpu"
  hub: "hf"
  trust_remote_code: true
